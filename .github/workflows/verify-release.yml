name: verify-release

# ★ r734：发版之后**由机器自己**去验一遍发布结果，而不是靠人肉记忆。
#   判据全部落在"外部顾客能看到的东西"上：
#     ① 从 Releases 下下来的文件，签名能不能用**站点上发布的公钥**验出来；
#     ② 站点上的 apt/dnf 仓库，真实的 apt / dnf 客户端能不能装；
#     ③ 仓库里拿到的那份，与 release 里那份是不是**同一个字节**（sha256 相等）。
#   这条 workflow 红了 = 这次发布对用户就是坏的，不管构建日志多绿。
on:
  # ★ 定时核验**线上已发布的东西**，而不是"发布那一刻对不对"：发版时的 workflow_run 只证明
  #   "刚发出去的没问题"；页面被改坏、Pages 漂移、密钥轮换只有定期跑才发现。
  #   定时触发没有 tag，`resolve the tag` 会回落到"当前最新 release"。
  schedule:
    - cron: '17 3 * * *'
  # ★ 发版 workflow 自己用 GITHUB_TOKEN 发 release，`release: published` 事件**不会再起**新
  #   workflow（GitHub 防递归），所以真正的自动入口是 workflow_run。
  workflow_run:
    workflows: [release]
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要验收的 tag（例如 v0.2.4）
        required: true
        default: v0.2.4

permissions:
  contents: read

env:
  SITE: https://openviewmobile.github.io/synhub
  # ★ 三种入口拿到 tag 的位置不同：release 事件在 event.release.tag_name，
  #   手动触发在 inputs.tag，而 workflow_run（发版 workflow 自己 push 了 tag）在
  #   event.workflow_run.head_branch。少写一个就会得到空串 —— r739 的
  #   "等了 12 分钟，站点索引仍不是 （拿到的是 0.2.7）" 就是这么来的。
  TAG: ${{ github.event.release.tag_name || inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  artifacts:
    name: release artifacts verify (signatures)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: resolve the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ★ 定时/手动都可能没给 tag ⇒ 回落"最新 release"。空 tag 直接往下跑会去核
          #   一个不存在的版本（`gh release download ""` 甚至会替你取 latest），
          #   那种"绿"没有意义，所以先把它变成确定的值。
          if [ -z "${TAG:-}" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            echo "未指定 tag ⇒ 核最新 release：$TAG"
          fi
          [ -n "$TAG" ] || { echo "::error::既没有给定 tag，也查不到最新 release"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "### 验收 \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: fetch the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "验收 $TAG"
          mkdir -p dist && cd dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*' --clobber
          ls -l | head -20

      - name: published key only
        run: |
          set -euo pipefail
          mkdir -p keys
          # ★ 只用**站点上**的公钥：验签时若偷偷用签名那把，等于没验。
          curl -fsSL --retry 5 --retry-all-errors "$SITE/keys/synhub-archive-keyring.asc" -o keys/pub.asc
          test -s keys/pub.asc
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/pub.asc
          gpg --batch --with-colons --fingerprint | awk -F: '/^fpr:/{print $10; exit}' > keys/fpr.txt
          echo "指纹：$(cat keys/fpr.txt)"
          echo "GNUPGHOME=$GNUPGHOME" >> "$GITHUB_ENV"

      - name: checksums and detached signatures
        run: |
          set -euo pipefail
          cd dist
          # 老版本只有 `SHA256SUMS.linux.txt`，新版本按架构分两份 —— 两种都接受，但至少要有一份
          ls SHA256SUMS.linux*.txt >/dev/null 2>&1 || { echo "::error::没有 Linux 校验和文件"; exit 1; }
          for f in SHA256SUMS.txt $(ls SHA256SUMS.linux*.txt); do
            [ -f "$f" ] || { echo "::error::缺少 $f"; exit 1; }
            [ -f "$f.asc" ] || { echo "::error::缺少 $f.asc"; exit 1; }
            gpg --batch --verify "$f.asc" "$f" 2>&1 | sed 's/^/  /'
          done
          for d in *.deb; do
            [ -f "$d.asc" ] || { echo "::error::$d 没有分离签名"; exit 1; }
            gpg --batch --verify "$d.asc" "$d" >/dev/null 2>&1 || { echo "::error::$d 分离签名无效"; exit 1; }
          done
          echo "=== 用签过名的 SHA256SUMS.txt 校验每一个产物 ==="
          grep -vE '^\s*$' SHA256SUMS.txt | sed 's#\./#./#' > /tmp/sums.txt
          sha256sum -c /tmp/sums.txt 2>&1 | tail -20
          sha256sum -c /tmp/sums.txt >/dev/null
          n_sums=$(grep -cE '^[0-9a-f]{64}' SHA256SUMS.txt || true)
          n_deb=$(ls -1 *.deb 2>/dev/null | wc -l | tr -d ' ')
          n_rpm=$(ls -1 *.rpm 2>/dev/null | wc -l | tr -d ' ')
          {
            echo "### 发布物验签"
            echo ""
            echo "| 项 | 数量 |"
            echo "|---|---|"
            echo "| SHA256SUMS 覆盖的产物 | $n_sums |"
            echo "| .deb（含分离签名） | $n_deb |"
            echo "| .rpm（含内嵌签名） | $n_rpm |"
            echo ""
            echo "全部签名均由**站点上发布的公钥**（指纹 $(cat ../keys/fpr.txt)）验证通过。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: rpm signature readable by both rpm generations
        run: |
          set -euo pipefail
          # ★ rpm 4.18 / 4.20（Fedora ≤41、RHEL ≤9）与 6.x 必须都读得出 —— v0.2.2/v0.2.3
          #   就是栽在"只有 6.x 读得出"上（旧发行版的 dnf 会认为包没签名）。
          for img in ubuntu:24.04 fedora:41; do
            echo "=== $img ==="
            docker run --rm -v "$PWD/dist:/w:ro" -v "$PWD/keys/pub.asc:/pub.asc:ro" -w /w "$img" bash -lc '
              set -e
              if ! command -v rpm >/dev/null; then
                apt-get update -qq >/dev/null 2>&1 || dnf -y -q install rpm >/dev/null 2>&1
                command -v rpm >/dev/null || { apt-get install -y -qq rpm >/dev/null 2>&1; }
              fi
              echo "rpm: $(rpm --version)"
              DB=$(mktemp -d); rpm --dbpath "$DB" --initdb; rpm --dbpath "$DB" --import /pub.asc
              rc=0
              for f in *.rpm; do
                out="$(rpm --dbpath "$DB" --checksig -v "$f")"
                echo "$out"
                grep -Eiq "signature.*: *OK" <<<"$out" || { echo "::error::$f 在 $(rpm --version) 上验不出签名"; rc=1; }
              done
              exit $rc
            '
          done

  repositories:
    name: live apt / dnf repositories
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: resolve the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # ★★★ 这一步必须**每个 job 各做一次**。通过 `$GITHUB_ENV` 写出来的变量
          #   只属于**那个 job**，不会跨 job 传递 —— r745 的 nightly 就是因此在
          #   `repositories` 里拿到空 TAG，报出"站点索引仍是 0.2.8，期望 "（期望值为空）。
          if [ -z "${TAG:-}" ]; then
            TAG="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)"
            echo "未指定 tag ⇒ 核最新 release：$TAG"
          fi
          [ -n "$TAG" ] || { echo "::error::既没有给定 tag，也查不到最新 release"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "本 job 核的是 \`$TAG\`（版本 ${TAG#v}）"
          echo "### 本 job 核的是 \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"

      - name: apt client (x86_64)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w ubuntu:24.04 bash -lc '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq >/dev/null 2>&1
            apt-get install -y -qq gnupg ca-certificates curl >/dev/null 2>&1
            curl -fsSL https://openviewmobile.github.io/synhub/keys/synhub-archive-keyring.asc \
              | gpg --dearmor -o /usr/share/keyrings/synhub.gpg
            echo "deb [signed-by=/usr/share/keyrings/synhub.gpg] https://openviewmobile.github.io/synhub/repo/apt stable main" \
              > /etc/apt/sources.list.d/synhub.list
            echo "=== apt-get update（InRelease 签名必须过关）==="
            apt-get update 2>&1 | grep -Ei "synhub|err" | head -5
            echo "=== 候选版本 ==="
            apt-cache policy synhub | sed -n "1,6p"
            echo "=== 下载 ==="
            cd /tmp && apt-get download synhub 2>&1 | tail -1
            ls -l /tmp/synhub*.deb | awk "{print \$5, \$9}"
            sha256sum /tmp/synhub*.deb | awk "{print \$1}" > /w/apt-downloaded-sha.txt
          '
          echo "从仓库下到的 deb sha256：$(cat apt-downloaded-sha.txt)"

      - name: dnf client (x86_64)
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/w" -w /w fedora:41 bash -lc '
            set -e
            cat > /etc/yum.repos.d/synhub.repo <<REPO
          [synhub]
          name=SynHub
          baseurl=https://openviewmobile.github.io/synhub/repo/rpm/\$basearch
          enabled=1
          gpgcheck=1
          repo_gpgcheck=1
          gpgkey=https://openviewmobile.github.io/synhub/keys/synhub-archive-keyring.asc
          REPO
            echo "=== dnf makecache（索引签名 + 公钥导入）==="
            dnf -y makecache 2>&1 | tail -3
            echo "=== repoquery ==="
            dnf -y repoquery --qf "%{name}-%{version}-%{release}.%{arch}" synhub
            echo "=== 下载（会走 gpgcheck）==="
            dnf -y download synhub 2>&1 | tail -3
            f="$(ls synhub-*.rpm | head -1)"
            echo "拿到：$f"
            sha256sum "$f" | awk "{print \$1}" > /w/dnf-downloaded-sha.txt
            rpm -Kv "$f" || true
          '
          echo "从仓库下到的 rpm sha256：$(cat dnf-downloaded-sha.txt)"

      - name: wait for the published repository to catch up
        run: |
          set -euo pipefail
          # ★ GitHub Pages 推送后一段时间内仍发上一次部署，而 `synhub_<ver>_amd64.deb`
          #   每次发布都重新构建 —— 同一路径、不同字节。匆匆一比就会报"不是同一份"的假红。
          #   先等索引里出现本 tag 的版本号，最多 12 分钟。
          # ★★ 期望值为空是最坏的一种红：消息会变成"等了 12 分钟，站点索引仍是 0.2.8，
          #   期望 " —— 看着像站点错了，其实是这个 job 根本没拿到 tag（r745 就是这样：
          #   `$GITHUB_ENV` 只在写它的那个 job 里有效）。先断言它非空，再等。
          [ -n "${TAG:-}" ] || { echo "::error::这个 job 没拿到 tag（TAG 为空）"; exit 1; }
          want="${TAG#v}"
          [ -n "$want" ] || { echo "::error::tag 解析不出向量版本（TAG=$TAG）"; exit 1; }
          echo "等待站点索引出现 $want ..."
          got=""
          for i in $(seq 1 36); do
            got="$(curl -fsSL --retry 3 "https://openviewmobile.github.io/synhub/repo/apt/dists/stable/main/binary-amd64/Packages" 2>/dev/null \
              | sed -n 's/^Version: //p' | head -1)"
            echo "  第 $i 次：apt=${got:-?}"
            if [ "$got" = "$want" ]; then echo "✅ 站点索引已更新到 $want"; exit 0; fi
            sleep 20
          done
          echo "::error::等了 12 分钟，站点索引仍是 ${got:-空}，期望 $want"
          exit 1

      - name: the repository serves the released bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'SHA256SUMS.txt' --dir /tmp/sums --clobber
          # ★ 按架构挑：容器是 x86_64，所以对的是 amd64 / x86_64 那份
          deb_expected="$(grep -E '_amd64\.deb$' /tmp/sums/SHA256SUMS.txt | awk '{print $1}' | head -1)"
          rpm_expected="$(grep -E 'x86_64\.rpm$' /tmp/sums/SHA256SUMS.txt | awk '{print $1}' | head -1)"
          [ -n "$deb_expected" ] || { echo "::error::SHA256SUMS.txt 里没有 amd64 的 deb"; exit 1; }
          [ -n "$rpm_expected" ] || { echo "::error::SHA256SUMS.txt 里没有 x86_64 的 rpm"; exit 1; }
          deb_got="$(cat apt-downloaded-sha.txt)"
          rpm_got="$(cat dnf-downloaded-sha.txt)"
          echo "deb  release=$deb_expected  apt 客户端=$deb_got"
          echo "rpm  release=$rpm_expected  dnf 客户端=$rpm_got"

          # ── ① 签名索引怎么说（这是仓库对外的**承诺**，比客户端下到的字节更权威）
          #    r742：`apt 仓库发的 deb 与 release 不是同一份` 那次，线上索引事后核对是
          #    一致的（8081afcd…），说明失败来自某一次抓取的抖动。判据改为：
          #    **签名索引里的 SHA256 必须等于 release 的**，最多等 10 次；客户端字节
          #    不一致时再直接挑一次缓存绕过的直链复核，避免把抖动判成缺陷。
          idx=""
          for i in $(seq 1 10); do
            idx="$(curl -fsSL --retry 3 "https://openviewmobile.github.io/synhub/repo/apt/dists/stable/main/binary-amd64/Packages" 2>/dev/null \
              | awk -v v="$TAG" '$1=="Version:"{ok=($2==substr(v,2))} ok && $1=="SHA256:"{print $2; exit}')"
            echo "  第 $i 次：索引里的 SHA256=${idx:-?}"
            [ "$idx" = "$deb_expected" ] && break
            sleep 20
          done
          [ "$idx" = "$deb_expected" ] || { echo "::error::签名索引里的 deb SHA256 与 release 不同（索引 $idx）"; exit 1; }
          echo '✅ 签名索引里的 deb 就是 release 里那份'

          # ── ② 真的把字节取回来再算一次（绕过 CDN 缓存）
          direct=""
          for i in $(seq 1 6); do
            direct="$(curl -fsSL --retry 3 "https://openviewmobile.github.io/synhub/repo/apt/pool/main/s/synhub/synhub_${TAG#v}_amd64.deb?cb=$RANDOM$i" \
              | sha256sum | awk '{print $1}')"
            echo "  第 $i 次：直链取回的 sha256=${direct:-?}"
            [ "$direct" = "$deb_expected" ] && break
            sleep 15
          done
          [ "$direct" = "$deb_expected" ] || { echo "::error::直链取回的 deb 与 release 不同（$direct）"; exit 1; }
          echo '✅ 直链取回的字节与 release 一致'

          {
            echo "### 真实客户端跑通的仓库"
            echo ""
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| release 里的 deb | \`$deb_expected\` |"
            echo "| 签名索引里的 deb | \`$idx\` |"
            echo "| 直链取回的字节 | \`$direct\` |"
            echo "| apt 客户端下到的 | \`$deb_got\` |"
            echo "| dnf 客户端下到的 rpm | \`$rpm_got\` |"
            echo ""
            echo "三者一致 = 仓库发的就是 release 里的那份；客户端那两列是同一次运行的实测。"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: site endpoints
        run: |
          set -euo pipefail
          for u in keys/synhub-archive-keyring.asc repo/apt/dists/stable/InRelease \
                   repo/apt/dists/stable/Release.gpg repo/rpm/synhub.repo \
                   repo/rpm/x86_64/repodata/repomd.xml; do
            code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors "$SITE/$u")"
            printf '%-52s %s\n' "$u" "$code"
            [ "$code" = "200" ] || { echo "::error::$u 返回 $code"; exit 1; }
          done
