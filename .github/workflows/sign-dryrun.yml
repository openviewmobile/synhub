name: sign-dryrun

# 一次性演练：用**真实 secret** 走一遍签名 → 建仓库 → 验签，不发版。
# r733：把 bundle 撑到真实量级（~40 MB），因为 v0.2.2 的真实包签完之后是**没有签名头**的，
# 而小体积的演练当时是绿的 —— 需要确认是不是体积/流程差异。
on:
  push:
    branches: [chore/sign-dryrun]

permissions:
  contents: read

jobs:
  dryrun:
    name: sign with the real key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio file rsync dpkg-dev apt-utils gnupg createrepo-c
      - name: realistic bundle
        run: |
          set -euo pipefail
          B=build/linux/x64/release/bundle
          mkdir -p "$B/lib" "$B/data"
          printf '#!/bin/sh\necho synhub\n' > "$B/synhub"; chmod +x "$B/synhub"
          head -c 30000000 /dev/urandom > "$B/lib/libapp.so"
          head -c 12000000 /dev/urandom > "$B/data/icons.bin"
      - name: build packages
        run: |
          set -euo pipefail
          bash scripts/build_linux_deb.sh
          bash scripts/build_linux_rpm.sh --verify
          ls -l build/linux_rpm/*.rpm build/linux_deb/*.deb
          sha256sum build/linux_deb/*.deb build/linux_rpm/*.rpm > SHA256SUMS.linux.txt
      - name: sign with the real key
        env:
          SYNHUB_GPG_PRIVATE_KEY: ${{ secrets.SYNHUB_GPG_PRIVATE_KEY }}
          SYNHUB_GPG_KEY_ID: ${{ secrets.SYNHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "${SYNHUB_GPG_PRIVATE_KEY:-}" || { echo "::error::secret 没配"; exit 1; }
          bash scripts/sign_linux_packages.sh \
            build/linux_deb/*.deb build/linux_rpm/*.rpm SHA256SUMS.linux.txt
          echo "=== 签名之后，文件有没有变、有没有签名头 ==="
          sha256sum build/linux_rpm/*.rpm
          rm -rf "$GNUPGHOME"
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          gpg --dearmor < keys/synhub-archive-keyring.asc > /tmp/pub.gpg
          RPMDB="$(mktemp -d)"; rpm --dbpath "$RPMDB" --initdb
          rpm --dbpath "$RPMDB" --import /tmp/pub.gpg
          rpm --dbpath "$RPMDB" --checksig -v build/linux_rpm/*.rpm
      - name: build the repositories
        env:
          SYNHUB_GPG_PRIVATE_KEY: ${{ secrets.SYNHUB_GPG_PRIVATE_KEY }}
          SYNHUB_GPG_KEY_ID: ${{ secrets.SYNHUB_GPG_KEY_ID }}
        run: |
          bash scripts/build_linux_repo.sh --out "$RUNNER_TEMP/pages" \
            build/linux_deb/*.deb build/linux_rpm/*.rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-repo-dryrun
          path: |
            build/linux_rpm/*.rpm
            build/linux_deb/*.deb*
            SHA256SUMS.linux.txt*
          if-no-files-found: error
