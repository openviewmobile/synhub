name: packaging-smoke

# r730：`scripts/build_linux_rpm.sh` 的**快速**回归。
#
# 为什么要有这个独立工作流：真正的 rpm 是在 `release.yml` 的 linux job 里打的，那条路
# 要先 `flutter build linux --release`（二十多分钟）走一次才知道有没有坏。打包脚本本身
# 坏掉（spec 语法、依赖声明、路径、%files 漏项）跟"Flutter 编不编得过"毫无关系，
# 所以这里用**合成 bundle** 只验打包：1 分钟出结果，改脚本就自动跑。
#
# 判据（缺一条都算红）：
#   ① 产物存在且是 x86_64；
#   ② 依赖里有我们显式声明的三个 soname（rpm 的 ELF 依赖生成器**不扫 /opt**，
#      一旦有人把这行当成冗余删掉，用户侧就是"装成功、起不来"，这里必须红）；
#   ③ `%files` 覆盖到启动器/桌面项/图标（卸载干净的判据是"全都列出来"）；
#   ④ 用 `rpm2cpio` 解出载荷，确认 /usr/bin/synhub 是软链；
#   ⑤ r732 起还验**签名与仓库**：用一把临时密钥签 rpm/deb/SHA256SUMS、建 apt+dnf 索引，
#      再逐条验签；顺带验"指纹守卫"两个方向（一致通过 / 不一致变红）。

on:
  push:
    paths:
      - 'scripts/build_linux_rpm.sh'
      - 'scripts/build_linux_deb.sh'
      - 'scripts/sign_linux_packages.sh'
      - 'scripts/build_linux_repo.sh'
      - 'keys/**'
      - '.github/workflows/rpm-smoke.yml'
  pull_request:
    paths:
      - 'scripts/build_linux_rpm.sh'
      - 'scripts/build_linux_deb.sh'
      - 'scripts/sign_linux_packages.sh'
      - 'scripts/build_linux_repo.sh'
      - 'keys/**'
      - '.github/workflows/rpm-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rpm:
    name: build + inspect rpm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install rpm tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm cpio file debsigs createrepo-c apt-utils gnupg rsync
          rpmbuild --version
      - name: synthetic bundle
        # 只给打包器一份"形状正确"的输入：一个真 ELF（好让 file/rpm 认得出架构）+ 一个
        # 假的数据目录。不碰 Flutter，所以这一步和 `flutter build` 的成败完全解耦。
        run: |
          set -euo pipefail
          B=build/linux/x64/release/bundle
          mkdir -p "$B/data/flutter_assets"
          cp /bin/true "$B/synhub"
          echo demo > "$B/data/flutter_assets/AssetManifest.json"
      - name: build rpm
        run: bash scripts/build_linux_rpm.sh --verify
      - name: assert the package says what it should
        run: |
          set -euo pipefail
          R=$(ls build/linux_rpm/*.rpm)
          echo "产物：$R"
          test "$(rpm -qp --queryformat '%{ARCH}' "$R")" = "x86_64" || { echo '❌ 架构不是 x86_64'; exit 1; }
          REQ=$(rpm -qpR "$R")
          for soname in 'libgtk-3.so.0()(64bit)' 'libsecret-1.so.0()(64bit)' 'libmpv.so.2()(64bit)'; do
            echo "$REQ" | grep -qF "$soname" || { echo "❌ 缺显式依赖：$soname（rpm 不会自动扫 /opt）"; exit 1; }
          done
          FILES=$(rpm -qlp "$R")
          for f in /usr/bin/synhub /usr/share/applications/com.openviewai.synhub.desktop \
                   /usr/share/icons/hicolor/256x256/apps/com.openviewai.synhub.png; do
            echo "$FILES" | grep -qx "$f" || { echo "❌ %files 里没有 $f（卸载不会清它）"; exit 1; }
          done
          echo "$FILES" | grep -q '^/opt/synhub/synhub$' || { echo '❌ 主程序没进包'; exit 1; }
          # 载荷里 /usr/bin/synhub 必须是软链（不是第二份拷贝）
          mkdir -p /tmp/x && cd /tmp/x && rpm2cpio "$OLDPWD/$R" | cpio -idm --quiet
          test -L usr/bin/synhub || { echo '❌ /usr/bin/synhub 不是软链'; exit 1; }
          test "$(readlink usr/bin/synhub)" = "/opt/synhub/synhub" || { echo '❌ 软链指向不对'; exit 1; }
          echo '✅ 依赖、%files、软链三项都对'
      - name: sign + repository smoke
        # ★ 这一段是 r732 新脚本的回归：签名、索引、指纹守卫。用**临时密钥**，
        #   不为测试引入真密钥；真密钥只存在于 Actions secret 里。
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          gpg --batch --pinentry-mode loopback --passphrase '' \
              --quick-gen-key 'SynHub smoke <smoke@example.com>' ed25519 sign 0 >/dev/null 2>&1
          KEYID="$(gpg --batch --with-colons --fingerprint | awk -F: '/^fpr:/{print $10; exit}')"
          export SYNHUB_GPG_PRIVATE_KEY="$(gpg --batch --armor --export-secret-keys "$KEYID")"
          export SYNHUB_GPG_KEY_ID="$KEYID"
          echo "临时密钥：$KEYID"

          bash scripts/build_linux_deb.sh >/dev/null
          sha256sum build/linux_rpm/*.rpm build/linux_deb/*.deb > SMSUMS.txt
          bash scripts/sign_linux_packages.sh build/linux_rpm/*.rpm build/linux_deb/*.deb SMSUMS.txt

          # 指纹守卫：先把声明对齐（正向），再故意写错（反向，必须红）
          cp keys/README.md /tmp/keys.bak
          sed -i "s/^key-fingerprint: .*/key-fingerprint: $KEYID/" keys/README.md
          bash scripts/build_linux_repo.sh --out /tmp/pages build/linux_rpm/*.rpm build/linux_deb/*.deb
          sed -i "s/^key-fingerprint: .*/key-fingerprint: 0000000000000000000000000000000000000000/" keys/README.md
          if bash scripts/build_linux_repo.sh --out /tmp/pages-bad build/linux_rpm/*.rpm build/linux_deb/*.deb >/dev/null 2>&1; then
            echo '❌ 指纹不一致时仓库脚本没有失败'; exit 1
          fi
          cp /tmp/keys.bak keys/README.md
          echo '✅ 指纹守卫两个方向都对'

          # 签名与索引必须**真的**能验：换一个干净的 GNUPGHOME，只导**发布的公钥**，
          # 避免"用签名时那把私钥顺手验过"的假绿。
          rm -rf "$GNUPGHOME"; export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          gpg --batch --import /tmp/pages/keys/synhub-archive-keyring.asc >/dev/null 2>&1
          gpg --batch --verify SMSUMS.txt.asc SMSUMS.txt
          gpg --batch --verify /tmp/pages/repo/apt/dists/stable/Release.gpg \
              /tmp/pages/repo/apt/dists/stable/Release
          gpg --batch --clearsign --verify /tmp/pages/repo/apt/dists/stable/InRelease >/dev/null 2>&1 \
            || gpg --batch --verify /tmp/pages/repo/apt/dists/stable/InRelease >/dev/null 2>&1
          gpg --batch --verify /tmp/pages/repo/rpm/*/repodata/repomd.xml.asc \
              /tmp/pages/repo/rpm/*/repodata/repomd.xml
          rpm --import /tmp/pages/keys/synhub-archive-keyring.asc
          rpm --checksig build/linux_rpm/*.rpm | grep -qi 'signatures OK'
          echo '✅ 索引与包的签名都能验（用发布的公钥）'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rpm-smoke
          path: |
            build/linux_rpm/*.rpm
            build/linux_deb/*.deb
          if-no-files-found: error
