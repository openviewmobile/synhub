name: platform-build

# 为什么要有这个工作流：这个仓的 CI 只跑 analyze/test，**从来不编任何平台**。
# 代价在 macOS 上真实发生过一次：`macos/Runner/MediaPlayerBridge.swift` 引用了一个
# 只存在于 iOS target 的符号，`flutter build macos` 一编就红，而 test/analyze 全绿 ——
# 于是"macOS 验收"在一棵**编不出来的树**上进行了一整段（内部编号 `D86`）。
#
# 所以：每个平台每周真编一次，红了说明"某个平台的树坏了"，而不是"某个用例抖了"。
# 只在 schedule + 手动触发：单次 macOS 构建代价高，不该挂在每个 PR 上。

on:
  schedule:
    # 每周二 04:37 UTC（与 coverage 的周一错开）
    - cron: '37 4 * * 2'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: web
            os: ubuntu-latest
            command: flutter build web --release
          - platform: linux
            os: ubuntu-latest
            command: flutter build linux --debug
            # 三个系统库是 CMake configure 阶段就要的（缺了是
            # "Unable to generate build files"，不是编译错，读起来像环境问题，
            # 所以按插件逐条写清来源）：
            #   libsecret-1  <- flutter_secure_storage_linux（要求 >=0.18.4）
            #   mpv          <- media_kit_video
            #   epoxy        <- media_kit_video
            apt: >-
              clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
              libstdc++-12-dev libsecret-1-dev libmpv-dev libepoxy-dev
          # 钉 windows-2022：windows-latest 已是 VS18 / MSVC 14.51，而依赖
          # `local_auth_windows` 用了被微软移除的 `<experimental/coroutine>`
          # ⇒ `error C2338: STL1011`。这是插件与工具链的兼容问题，不是本仓代码；
          # 等插件修好后再考虑回到 windows-latest。
          - platform: windows
            os: windows-2022
            command: flutter build windows --debug
          - platform: macos
            os: macos-latest
            command: flutter build macos --debug
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install linux deps
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: pub get
        run: flutter pub get
      - name: gen-l10n
        run: flutter gen-l10n
      - name: seed flutter_gemma native libs
        # 六端 build 同样会触发那个 hook（它的下载地址已失效），不预置就整场红。
        # web 不需要原生库，跳过。
        if: matrix.platform != 'web'
        shell: bash
        run: |
          case "${{ matrix.platform }}" in
            linux)   dir=linux_x86_64 ;;
            windows) dir=windows_x86_64 ;;
            macos)   dir=macos_arm64 ;;
            android) dir=android_arm64 ;;
            ios)     dir=ios_arm64 ;;
            *)       dir= ;;
          esac
          if [ -z "$dir" ]; then echo "无需预置"; exit 0; fi
          bash tool/seed_native_libs.sh "$dir"
      - name: build
        run: ${{ matrix.command }}
      - name: summary
        if: always()
        shell: bash
        run: |
          echo "| platform | command | result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| ${{ matrix.platform }} | \`${{ matrix.command }}\` | ${{ job.status }} |" >> "$GITHUB_STEP_SUMMARY"
