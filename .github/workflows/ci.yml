name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      # 固定到 commit SHA（而不是 tag）：tag 可以被上游重新指向 ⇒ 供应链风险。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: pub get
        run: flutter pub get
      - name: gen-l10n
        run: flutter gen-l10n
      - name: analyze
        run: flutter analyze lib test tool/mock_dsm
      - name: test
        # 整份用例日志直接进步骤日志会触发 GitHub 的截断：它砍掉**中间**，
        # 恰好把失败原因砍没（run 42338934283 就这样丢了 23 分钟的现场）。
        # 所以：全量写文件，步骤里只贴尾部；失败时再贴判据行。
        run: |
          set +e
          flutter test --reporter compact > /tmp/test.log 2>&1
          rc=$?
          tail -n 120 /tmp/test.log
          if [ "$rc" -ne 0 ]; then
            # ★ r726：判据命中为 0 ≠ 没有失败。四次红里有一半是"计数 +1 但判据一行没打印"
            #   （`photo_album_write_test` 那例：日志里只有 drift 的多库告警栈，没有 [E]）。
            #   所以补一条兜底：把**第一次**失败出现位置的上下文原样贴出来。
            if ! grep -qE '\[E\]$|Expected:|Actual:|Which:|EXCEPTION CAUGHT|timed out|TimeoutException|pumpAndSettle' /tmp/test.log; then
              echo "::group::no failure marker found — context around the first failure count"
              first=$(grep -nE ' -[1-9][0-9]*: ' /tmp/test.log | head -n 1 | cut -d: -f1)
              if [ -n "$first" ]; then
                start=$((first > 60 ? first - 60 : 1))
                sed -n "${start},${first}p" /tmp/test.log
              else
                tail -n 60 /tmp/test.log
              fi
              echo "::endgroup::"
            fi
            echo "::group::failing tests"
            # ★ r725：原判据漏了**超时**。三次 CI 红都是「失败数 +1 但判据行一条没打印」，
            #   因为超时打的是 `Test timed out after …` / `pumpAndSettle timed out`，
            #   既不以 `[E]` 结尾也不含 Expected/EXCEPTION ⇒ 现场全丢。
            grep -nE '\[E\]$|Expected:|Actual:|Which:|EXCEPTION CAUGHT|Some tests failed|Test failed\. See|timed out|TimeoutException|pumpAndSettle' /tmp/test.log | head -n 80
            echo "::endgroup::"
          fi
          exit "$rc"
      - name: secret scan
        # 词表只放在仓库的 Actions secret 里（SECRET_WORDS），公开代码里只留读取逻辑。
        env:
          SECRET_WORDS: ${{ secrets.SECRET_WORDS }}
        run: bash tool/secret_scan.sh

  # 依赖漏洞扫描：与 analyze-test 分开，失败时一眼能看出是"代码问题"还是"依赖问题"。
  # 用 Google 官方 action（固定到 commit SHA），它内部跑 osv-scanner 的 docker 镜像。
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          # 参数取自 action 仓库自己的示例 workflow（v2 CLI 认这两个参数）
          scan-args: |-
            --include-git-root
            -r
            ./
