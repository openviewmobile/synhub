name: release

# 为什么**在 GitHub 上编**而不是本机编好再上传：
#   ① 产物与 tag 对应的 commit 绑定，谁都能从 tag 重编一遍对照；
#   ② 签名口令只存在于 Actions secrets，不经过任何人的笔记本；
#   ③ 挂附件的动作由 `gh` 完成，不需要人手点文件选择框。
#
# 触发：推一个 `v*` tag ⇒ 六个平台全部构建 + 发布。
#       workflow_dispatch ⇒ 只构建，产物进 workflow artifacts（用来验证，不发布）。
#
# ★ 签名档位是**如实**的，不假装：
#   Android —— 有 secret 就用项目发布密钥；没有就出 debug 签名的包并大声警告；
#   iOS     —— **未签名** .ipa（--no-codesign）。真机安装必须自己重签（AltStore/Sideloadly 等）；
#   macOS   —— ad-hoc 签名（`Signature=adhoc`），下载后 Gatekeeper 会拦，见 RELEASING.md；
#   Windows —— zip（未做 MSIX 与 Authenticode 签名）；
#   Linux   —— deb + rpm + tar.gz（未做仓库签名）；
#   Web     —— 静态站打包（未做任何托管）。

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: android (arm64-v8a)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: NDK (for the hole-punch library)
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$(ls -A "$SDK/ndk" 2>/dev/null)" ]; then
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358"
          fi
          ls "$SDK/ndk"

      - run: flutter pub get
      - run: flutter gen-l10n
      - name: native hole-punch library
        run: bash reimpl/scripts/build_android.sh

      - name: signing material
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          # 没有 secret 就**不签**：宁可产出 debug 签名的包并明确标注，
          # 也不要一个"看起来是发布包、其实是 debug 密钥"的东西混进 release。
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::warning::ANDROID_KEYSTORE_BASE64 未配置 —— 本次产物是 debug 签名，仅供验证"
            echo "SIGNED=no" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          {
            echo "SYNHUB_KEYSTORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SYNHUB_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}"
            echo "SYNHUB_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}"
            echo "SYNHUB_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"
          echo "SIGNED=yes" >> "$GITHUB_ENV"

      - name: build apk
        run: |
          set -euo pipefail
          if [ "${SIGNED}" = "yes" ]; then
            SYNHUB_SIGN=release bash scripts/build_arm64_release.sh
          else
            bash scripts/build_arm64_release.sh
          fi

      - name: verify
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          test -f "$APK"
          APKSIGNER="$(command -v apksigner || true)"
          if [ -z "$APKSIGNER" ]; then
            APKSIGNER="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1 || true)"
          fi
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner 找不到 —— 无法核对签名者，拒绝产出"
            exit 1
          fi
          "$APKSIGNER" verify --print-certs "$APK" | sed -n '1,4p'
          # ★★ 不能写成 `unzip -l "$APK" | grep -q ...`：`grep -q` 一命中就关管道，
          #   `unzip` 收到 SIGPIPE（141），而 `set -o pipefail` 会把整条管道判成失败 ——
          #   于是"库明明在包里"也会红。r741 的 release #18 就是这么在 android 上挂的
          #   （v0.2.7 同样的代码却绿），说明它随时序抖动。先落盘再 grep。
          unzip -l "$APK" > /tmp/apk-list.txt
          grep -q "lib/arm64-v8a/libsynochatpunch.so" /tmp/apk-list.txt \
            || { echo "::error::APK 里没有 arm64 的 hole-punch 库"; exit 1; }
          V="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          cp "$APK" "synhub-${V}-android-arm64.apk"
          sha256sum synhub-*.apk
          # 体积构成落到日志里：116.8MB 的包必须能一眼看出是谁占的
          # （release #2/#3 的 APK 就是 116.8MB，而本地 release 包历史上是 27–32MB）。
          echo "==> APK 内容 top 20（按压缩前大小）"
          unzip -l "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $1, $4}' | sort -rn | head -20

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android
          path: synhub-*-android-arm64.apk
          if-no-files-found: error

  ios:
    name: ios (unsigned ipa)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      # Runner 的 OTHER_LDFLAGS 里是 -force_load "$(SRCROOT)/lib/libsynochatpunch.a"，
      # 缺这个静态库 Xcode 直接 "Build input file cannot be found"（release #1 实测）。
      - name: native hole-punch library (device)
        run: bash reimpl/scripts/build_ios.sh --device
      # 没有 Apple 开发者证书 ⇒ 只能出**未签名**包。这不是"发布版 iOS App"，
      # 是给会自己重签的人用的产物；RELEASING.md 里写清了这一点。
      - run: flutter build ios --release --no-codesign
      - name: pack ipa
        run: |
          set -euo pipefail
          V="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          APP="$(ls -d build/ios/iphoneos/*.app | head -1)"
          echo "app: $APP"
          rm -rf /tmp/ipa && mkdir -p /tmp/ipa/Payload
          cp -R "$APP" /tmp/ipa/Payload/
          (cd /tmp/ipa && zip -qry "$GITHUB_WORKSPACE/synhub-${V}-ios-unsigned.ipa" Payload)
          unzip -l "synhub-${V}-ios-unsigned.ipa" | head -12
          shasum -a 256 "synhub-${V}-ios-unsigned.ipa"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios
          path: synhub-*-ios-unsigned.ipa
          if-no-files-found: error

  macos:
    name: macos (adhoc)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build macos --release
      - name: pack zip + dmg
        run: |
          set -euo pipefail
          V="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          APP="$(ls -d build/macos/Build/Products/Release/*.app | head -1)"
          echo "app: $APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | sed -n '1,8p' || true
          ditto -c -k --sequesterRsrc --keepParent "$APP" "synhub-${V}-macos.zip"
          # ★ 只把 .app 放进 dmg。v0.2.0 直接拿 `dirname "$APP"`（Release 目录）当源，
          #   把同目录的 *.dSYM 调试符号一起打了进去 —— 311MB 的 dmg 就是这么来的
          #   （同一次构建的 zip 是 53MB）。顺带加一个 /Applications 软链，
          #   装的时候可以直接拖。
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create -volname "SynHub" -srcfolder "$STAGE" -ov -format UDZO "synhub-${V}-macos.dmg" >/dev/null
          rm -rf "$STAGE"
          ls -lh "synhub-${V}-macos.zip" "synhub-${V}-macos.dmg"
          shasum -a 256 "synhub-${V}-macos.zip" "synhub-${V}-macos.dmg"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: |
            synhub-*-macos.zip
            synhub-*-macos.dmg
          if-no-files-found: error

  windows:
    name: windows (zip)
    # 钉 windows-2022：windows-latest 是 VS18 / MSVC 14.51，而依赖 local_auth_windows
    # 仍用被移除的 <experimental/coroutine> ⇒ error C2338。见 platform-build.yml。
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build windows --release
      - name: pack zip
        shell: pwsh
        run: |
          $V = (Select-String -Path pubspec.yaml -Pattern '^version:\s*(\S+)' ).Matches[0].Groups[1].Value -replace '\+.*$',''
          # ★ 去掉 .pdb 调试符号：它们对终端用户没用，且能把 zip 撑到 143MB。
          $pdbs = Get-ChildItem -Path build\windows\x64\runner\Release -Recurse -Include *.pdb
          if ($pdbs) { "removing $($pdbs.Count) pdb file(s)"; $pdbs | Remove-Item -Force }
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "synhub-$V-windows-x64.zip" -Force
          Get-Item "synhub-$V-windows-x64.zip" | Format-List Name,Length
          Get-FileHash "synhub-$V-windows-x64.zip" -Algorithm SHA256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows
          path: synhub-*-windows-x64.zip
          if-no-files-found: error

  linux:
    name: linux (deb + rpm + tar.gz)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libsecret-1-dev libmpv-dev libepoxy-dev dpkg-dev rpm
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build linux --release
      - name: packages
        run: |
          set -euo pipefail
          V="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          bash scripts/build_linux_deb.sh
          # ★ r730：rpm 与 deb 同源同 bundle，只是给 Fedora/RHEL/openSUSE 一个"能装"的形态。
          #   依赖按 soname 声明（rpm 的 ELF 依赖生成器不扫 /opt，靠推导会一条都没有）。
          bash scripts/build_linux_rpm.sh --verify
          tar -C build/linux/x64/release/bundle -czf "synhub-${V}-linux-x64.tar.gz" .
          ls -lh build/linux_deb/*.deb build/linux_rpm/*.rpm "synhub-${V}-linux-x64.tar.gz"
          sha256sum build/linux_deb/*.deb build/linux_rpm/*.rpm "synhub-${V}-linux-x64.tar.gz"
      - name: sign packages
        # ★ r732：GPG 签名（项目自有密钥）。没配 secret 时脚本会告警后跳过，
        #   job 不会因此失败 —— 但摘要里会写明"本次未签名"，不假装。
        env:
          SYNHUB_GPG_PRIVATE_KEY: ${{ secrets.SYNHUB_GPG_PRIVATE_KEY }}
          SYNHUB_GPG_KEY_ID: ${{ secrets.SYNHUB_GPG_KEY_ID }}
          # ★★ runner 的 rpm 已经是 6.x，它签出来的包 Fedora ≤41 / RHEL ≤9（rpm 4.x）
          #   **读不出签名** ⇒ `dnf gpgcheck=1` 会拒装。这里用 rpm 4.18 的容器去签，
          #   冒烟里有两代 rpm 的硬断言守着（`packaging-smoke` 的跨代检查）。
          SYNHUB_RPM_SIGN_IMAGE: ubuntu:24.04
        run: |
          set -euo pipefail
          sha256sum build/linux_deb/*.deb build/linux_rpm/*.rpm > SHA256SUMS.linux.txt
          bash scripts/sign_linux_packages.sh \
            build/linux_deb/*.deb build/linux_rpm/*.rpm SHA256SUMS.linux.txt
          ls -l build/linux_deb/*.asc build/linux_rpm/*.asc SHA256SUMS.linux.txt* 2>/dev/null || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: |
            build/linux_deb/*.deb
            build/linux_deb/*.deb.asc
            build/linux_rpm/*.rpm
            SHA256SUMS.linux.txt
            SHA256SUMS.linux.txt.asc
            synhub-*-linux-x64.tar.gz
          if-no-files-found: error

  web:
    name: web (static bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - run: flutter pub get
      - run: flutter gen-l10n
      - run: flutter build web --release
      - name: pack
        run: |
          set -euo pipefail
          V="$(awk '/^version:/{print $2}' pubspec.yaml | cut -d+ -f1)"
          tar -C build/web -czf "synhub-${V}-web.tar.gz" .
          sha256sum "synhub-${V}-web.tar.gz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: synhub-*-web.tar.gz
          if-no-files-found: error

  publish:
    name: publish
    needs: [android, ios, macos, windows, linux, web]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # ★ provenance（SLSA 来源证明）：id-token 用来拿 OIDC，attestations 用来写证明
      id-token: write
      attestations: write
    steps:
      # ★ 必须 checkout：签名与建仓库都调 `scripts/*.sh`，`build_linux_repo.sh` 还要读
      #   `keys/README.md` 做指纹核对 —— 没有这一步，两个新步骤第一步就 `No such file`。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          path: dist
          merge-multiple: true
      - name: checksums
        run: |
          set -euo pipefail
          cd dist
          # ★ `download-artifact@v5` 在 dist 里多留一层目录（`build/linux_deb/*.deb`
          #   的父目录被保留），`sha256sum *` 撞上目录就 "Is a directory" 退出 1
          #   —— v0.2.0 的 publish 就是这样挂的（六个平台的构建全是绿的）。
          #   只对**普通文件**做摘要，并把它们平铺到 dist/ 根。
          find . -type f ! -name SHA256SUMS.txt -print0 \
            | xargs -0 -I{} sh -c 'mv -f "$1" "./$(basename "$1")" 2>/dev/null || true' _ {}
          find . -mindepth 1 -type d -empty -delete
          # 摘要只取 dist 根下的普通文件（`sha256sum *` 会再次撞上残留目录）
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 \
            | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
          cat SHA256SUMS.txt
          test -s SHA256SUMS.txt || { echo "::error::SHA256SUMS.txt 是空的"; exit 1; }
      - name: sign the checksums file
        # ★ r732：`SHA256SUMS.txt` 如果只是裸文本，改了文件顺手改校验和毫无门槛；
        #   分离签名之后它才是一份**可验证的**清单。
        env:
          SYNHUB_GPG_PRIVATE_KEY: ${{ secrets.SYNHUB_GPG_PRIVATE_KEY }}
          SYNHUB_GPG_KEY_ID: ${{ secrets.SYNHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          cd dist
          bash ../scripts/sign_linux_packages.sh SHA256SUMS.txt || true
          ls -l SHA256SUMS.txt* || true
      - name: refuse to publish unsigned packages
        # ★ v0.2.2 的 `.rpm` 发布后**验不出签名**，而它自己的签名步骤当场报过 "已签并验证"。
        #   结论：签完就自验不可信 —— 发布之前用发布的公钥、在干净的 rpm 库里再验一次，不过就不许上传。
        run: |
          set -euo pipefail
          cd dist
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rpm gnupg
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          # ★ 公钥用 armored 原件：rpm 6（runner 上已是 6.0.1）喂二进制会报
          #   `key 1 not an armored public key`，而 4.x 两种都吃 —— 统一给 armored。
          KEYRING="$GITHUB_WORKSPACE/keys/synhub-archive-keyring.asc"
          test -s "$KEYRING" || { echo "::error::找不到 $KEYRING"; exit 1; }
          gpg --batch --import "$KEYRING"
          RPMDB="$(mktemp -d)"; rpm --dbpath "$RPMDB" --initdb
          rpm --dbpath "$RPMDB" --import "$KEYRING"
          fail=0
          for r in *.rpm; do
            [ -e "$r" ] || continue
            out="$(rpm --dbpath "$RPMDB" --checksig -v "$r")"
            echo "$out"
            # 措辞随版本变（4.18: `… Signature, key ID …: OK`；6.x: `Header OpenPGP V4 … signature …: OK`）
            grep -Eiq 'signature.*: *OK' <<<"$out" || { echo "::error::$r 没有可验证的签名头"; fail=1; }
          done
          for d in *.deb; do
            [ -e "$d" ] || continue
            gpg --batch --verify "$d.asc" "$d" || { echo "::error::$d 的分离签名校验失败"; fail=1; }
          done
          [ "$fail" = 0 ] || exit 1
          echo '✅ 包签名独立复核通过'
      - name: upload to the tag's release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 这个 job 没有 checkout，`gh` 会去猜仓库而报
          # "failed to run git: fatal: not a git repository"（v0.2.0 第二次挂在这）
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          cd dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            # ★ 发布说明必须先回答"这一版改了什么"。以前正文是一段固定模板，用户只能去翻
            #   CHANGELOG 或 commit —— 那等于没写。这里把 CHANGELOG 里本 tag 的那一节
            #   摘出来放最前面；摘不到就**继续发布但不编内容**（下面的模板照旧），
            #   因为"发不出去"比"说明少一段"更坏。
            : > /tmp/changes.md
            if python3 scripts/changelog_section.py "${TAG#v}" > /tmp/section.md 2>/tmp/section.err; then
              {
                echo "## 本版改动（CHANGELOG 摘录）"
                echo
                cat /tmp/section.md
                echo
                echo "---"
                echo
              } > /tmp/changes.md
            else
              echo "::warning::CHANGELOG 里没有 ${TAG#v} 这一节，发布说明将只有资产表：$(cat /tmp/section.err)"
            fi
            cat > /tmp/notes_tail.md <<'NOTES'
          Unofficial, from-scratch client for Synology NAS. Not affiliated with, endorsed by, or
          supported by Synology Inc.

          **Assets**

          | File | Platform | Signing |
          |---|---|---|
          | `*-android-arm64.apk` | Android arm64-v8a | project release key (or debug key, if the secrets are not configured — the job warns) |
          | `*-ios-unsigned.ipa` | iOS | **unsigned** — re-sign it yourself before installing on a device |
          | `*-macos.zip` / `*-macos.dmg` | macOS | **ad-hoc**; clear the quarantine attribute, see RELEASING.md |
          | `*-windows-x64.zip` | Windows x64 | unzip and run `synhub.exe` (no Authenticode signature) |
          | `*.deb` / `*.rpm` / `*-linux-x64.tar.gz` | Linux x64 | GPG-signed when the signing secret is configured (rpm embedded, deb detached); see `keys/README.md` |
          | `*-web.tar.gz` | Web | static bundle, needs a static server (and same-origin for encrypted DSM writes) |

          Verify with `sha256sum -c SHA256SUMS.txt` before installing, and read
          [RELEASING.md](https://github.com/openviewmobile/synhub/blob/main/RELEASING.md) for what
          each signature level does and does not mean.

          Or let the repository do it for you: download `SHA256SUMS.txt`, `SHA256SUMS.txt.asc` and the
          file you want into one directory, then run
          `scripts/verify_download.sh <那个目录>` — it fetches the published key into a throwaway
          keyring, checks the signed checksum, the bytes, and the deb/rpm signature.
          NOTES
            cat /tmp/changes.md /tmp/notes_tail.md > /tmp/notes.md
            gh release create "$TAG" --title "$TAG" --notes-file /tmp/notes.md
          fi
          gh release upload "$TAG" ./* --clobber
      - name: attest build provenance
        # ★ 免费且三端通用：证明"这个文件由这个仓库的这次 workflow、这个 commit 产出"。
        #   它**不替代** Gatekeeper/SmartScreen 的签名，但能证明产物没被换过。
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # 只对**文件**出证明（dist 里还有 pages/ 目录）
          subject-path: |
            dist/*.apk
            dist/*.ipa
            dist/*.zip
            dist/*.dmg
            dist/*.deb
            dist/*.rpm
            dist/*.tar.gz
            dist/SHA256SUMS.txt
      - name: build the package repositories
        id: repo
        env:
          SYNHUB_GPG_PRIVATE_KEY: ${{ secrets.SYNHUB_GPG_PRIVATE_KEY }}
          SYNHUB_GPG_KEY_ID: ${{ secrets.SYNHUB_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          if [ -z "${SYNHUB_GPG_PRIVATE_KEY:-}" ]; then
            echo "::warning::没有 GPG 密钥 —— 跳过 apt/dnf 仓库（本次只发文件，不发仓库）"
            echo "built=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg createrepo-c apt-utils
          DEBS="$(ls dist/*.deb 2>/dev/null || true)"
          RPMS="$(ls dist/*.rpm 2>/dev/null || true)"
          if [ -z "$DEBS$RPMS" ]; then
            echo "::error::dist 里没有 deb/rpm，仓库无从生成"; exit 1
          fi
          # ★ 输出到 /tmp/pages 而不是 dist/pages：dist 根后面要 `gh release upload ./*`，
          #   多一个目录就会让上传失败。
          bash scripts/build_linux_repo.sh --out /tmp/pages $DEBS $RPMS
          echo "built=yes" >> "$GITHUB_OUTPUT"
      - name: publish the repositories to gh-pages
        # ★ 站点根 = gh-pages 分支根：https://openviewmobile.github.io/synhub/
        #   用户侧 `apt`/`dnf` 的 baseurl 就指到这里（见 README 的安装段）。
        if: steps.repo.outputs.built == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          cp -a /tmp/pages/. "$WORK/"
          cd "$WORK"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "repo: ${{ github.ref_name }}"
          # 只推这一个分支，不碰 main；强制推送是因为每次发版整棵树重建
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
