name: Feature request
description: Suggest an addition
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
    validations: { required: true }
  - type: dropdown
    id: platform
    attributes:
      label: Platform(s)
      multiple: true
      options: [Android, iOS, macOS, Linux, Windows, Web]
