name: synhub
description: "SynHub — an unofficial, from-scratch Flutter client for Synology NAS (DiskStation) quick-connect, files, photos, chat, notes, audio, drive, download and office suites."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none'
repository: https://github.com/openviewmobile/synhub
homepage: https://github.com/openviewmobile/synhub
issue_tracker: https://github.com/openviewmobile/synhub/issues

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.9.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # 本地化（flutter_quill 的工具栏文案 + Material/Cupertino 内置控件）
  flutter_localizations:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # 空洞穿透隧道（自研原生库）的 Dart FFI 绑定
  ffi: ^2.1.0

  # QuickConnect / DSM WebAPI 的 HTTP 客户端
  dio: ^5.7.0
  # ★ r664（`DA281`）：Web 站的实时通道。`dart:io` 的 WebSocket 在浏览器上
  #   是运行期抛的桩 ⇒ 条件导入这个包（web 上映射到原生 `WebSocket`）。
  #   它本来就在 `pubspec.lock` 里（dio/drift 的传递依赖），不新增下载。
  web_socket_channel: ^3.0.3
  pointycastle: ^4.0.0
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  drift: 2.35.0
  # ★ r667：`web/sqlite3.wasm` 钉在 **3.6.0**（字节数 + sha256 见
  #   `test/web_assets_version_test.dart`）⇒ 传递依赖也必须留在同一版本，
  #   否则浏览器里的 wasm 与 Dart 侧 ABI 对不上（真浏览器实测：库根本打不开）。
  #   本轮容器里 `pub get` 把 lock 解析到 3.8.0 ⇒ `web_assets_version_test` 两条红，
  #   按"钉住"的规矩在这里显式声明 3.6.0。
  sqlite3: 3.6.0
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  image_picker: ^1.2.3
  url_launcher: ^6.3.2
  webview_flutter: ^4.9.0
  open_filex: ^4.7.0
  http_parser: ^4.1.2
  path_provider: ^2.1.6
  # `path`：拼接/取 basename（端侧模型保管库要拼 Android/media 目录）。
  # 它本来就是 path_provider 的传递依赖、已在 pubspec.lock 里，不新增下载。
  path: ^1.9.0
  record: ^7.1.1
  just_audio: ^0.10.6
  pinenacl: ^0.6.0
  blake2b: ^0.2.3
  # 发送图片时的「标准质量」预处理（长边 1280 + JPEG 90，对齐原版 BitmapUtil）
  # ★ r665：`image` **钉死**在 4.10.1。4.11.0 的 `png_decoder.dart` 调
  #   `ZLibDecoder.decodeLazy`，而本仓锁着的 `archive 4.0.9` 没有这个方法 ⇒
  #   **Linux/arm64 构建直接编译失败**（`Error: The method 'decodeLazy' isn't
  #   defined for the type 'ZLibDecoder'`）；macOS/Android 侧因为 lock 里是
  #   4.10.1 所以一直没暴露。区间约束会让新机器重新解析到 4.11.0，
  #   所以这里改成精确版本（升级前必须先升 `archive`）。
  image: 4.10.1
  local_auth: ^3.0.2
  meta: ^1.19.0
  dynamic_color: ^1.7.0
  flutter_quill: ^11.6.0
  html: ^0.15.7
  pdfx: ^2.11.0

  # EPUB / CBZ 就是 zip 包（电子书阅读要**运行时**解压，不只是探针用）
  archive: ^4.0.7
  # OOXML（.odoc/.osheet/.oslides 的**真实**载体）解析：
  # 真机+服务端实测 —— `SYNO.SynologyDrive.Files:download` 回来的
  #   `.odoc` = 标准 DOCX（word/document.xml、styles/numbering、headers/footers）
  #   `.osheet` = 标准 XLSX（xl/worksheets/sheet1.xml 含 <cols> 列宽 + 单元格 s= 样式索引）
  #   `.oslides` = 标准 PPTX（ppt/slides/slideN.xml + slideLayouts + slideMasters）
  # 见 `docs/ooxml-ground-truth.md`。这是对齐 WPS/MS Office 显示效果的正确路径。
  xml: ^6.5.0
  markdown: ^7.3.1
  flutter_gemma: ^1.8.3
  flutter_gemma_litertlm: ^1.6.4
  intl: any
  qr_flutter: ^4.1.0
  flutter_secure_storage: ^11.2.0
  lunar: ^1.7.8
  flutter_tts: ^4.2.5
  video_player: ^2.14.0
  # ★ r655：AC3/EAC3/DTS/APE 的**软件解码兜底**。Media3 在这些编码上要么没有
  #   解码器要么依赖厂商（HONOR 有 `dtsaudio`，别的机器没有）⇒ 主引擎拿不动
  #   时改走 libmpv（自带完整 ffmpeg，软解全格式）。只在需要时载入，
  #   见 `lib/src/features/media/mpv_player_adapter.dart`。
  #   代价：`media_kit_libs_android_video` 给 arm64 加约 20MB .so（只出 arm64）。
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_android_video: ^1.3.8
  # ★ r678：**iOS 也接 libmpv**。r676 之前 iOS 只有 AVFoundation（`.mkv` 报
  #   `-11828`、`.AVI` 零画面）⇒ 只能给兜底面板；r677 实测这条依赖能在模拟器里
  #   编过、链上 `Mpv.framework` 并对 mkv/avi 解出 `w/h`（见
  #   `docs/platform-ios-decode-feasibility.md`）⇒ 本轮把它接进产品分支。
  #   体积：设备 slice ≈ +20MB（xcframework 全量 80MB 只在构建期）。
  #   ⚠️ `media_kit_video` 的 iOS podspec 是**条件式**的：lock 里没有这条就编 stub
  #      （那正是 r676 之前 iOS 的真实状态），所以这一行是开关本身。
  media_kit_libs_ios_video: ^1.1.4
  # ★ r690：Linux 站的两处本地播放实现（r690 起 Linux 不再"没有播放器"）。
  #   `media_kit_libs_linux` 给视频兜底引擎带上 Linux 版 libmpv 动态库；
  #   `just_audio_media_kit` 把 `just_audio` 的后端换成 media_kit（libmpv），
  #   否则 Audio Station 那条 just_audio 路在 Linux 上必撞 MissingPluginException。
  media_kit_libs_linux: ^1.2.1
  #   ★ r703：**Windows 也并入 media_kit** —— 这条包在 CMake 配置期下载
  #   `mpv-dev-x86_64-*.7z`（校验 MD5）并摆进 runner 目录，音频走
  #   `just_audio_media_kit`、视频走 `MpvPlayerAdapter`。不装它，Windows 上
  #   `AppHost.windows.localMediaPlayback` 只能如实写 not-implemented（r295 读数）。
  media_kit_libs_windows_video: ^1.0.11
  just_audio_media_kit: ^2.1.0
  audio_service: ^0.18.19
  dbus: ^0.8.0                     # r699：Linux MPRIS（媒体键/系统媒体面板）
  audio_session: ^0.1.21
  pdf: ^3.12.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  # 真机验收（integration_test/phase2_test.dart）
  # integration_test:   # 构建期临时注释，见 docs/release-build-integration-test.md
    #   sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0

  # 视频/图片选择器的**真实 seam**：`ImagePicker().pickVideo()` 最终落到
  # `ImagePickerPlatform.instance.getVideo(...)`。`test/chat_video_picker_seam_mock_test.dart`
  # 需要假的 platform 实例来验证"相册 / 相机"两个 source 是否真的传对了 ——
  # 只 override 我们自己那层 `chatVideoPickerProvider` 是**测不到** `ImagePicker()`
  # 这一环的。这是 `image_picker` 官方文档推荐的测试方式。
  image_picker_platform_interface: ^2.11.1


  # drift 代码生成（build_runner 的 builder 需要作为 dev 依赖显式声明才会
  # auto_apply；仅放在 dependency_overrides 里不会生效）。
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  path_provider_platform_interface: ^2.1.3

# path_provider_foundation 2.5+ 依赖 objective_c，而 objective_c 9.6.x 的构建 hook
# 需要 code_assets 2.1.0 的 `Architecture.arm64e`；本机 PUB_HOSTED_URL 镜像
# (pub.flutter-io.cn) 目前只同步到 code_assets 2.0.0，会让 `flutter test` /
# `dart run` 在编译 hook 阶段直接失败。这里固定在不需要 objective_c 的 2.4.x。
# 镜像同步到 code_assets 2.1.0 后即可删掉这条 override。
dependency_overrides:
  path_provider_foundation: 2.4.3
  drift_dev: ^2.35.0
  build_runner: ^2.16.1

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # 多语言：ARB 在 lib/l10n/，生成代码进 lib/l10n/gen（见 l10n.yaml）
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

