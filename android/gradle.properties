org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# 只出 arm64-v8a。fluter tool 自己会传 `-Ptarget-platform=…`（命令行 -P 优先级
# 更高，所以设备构建/`tool/build_apk.sh` 不受影响）；这一行是给**不经 flutter
# tool 的构建**（Android Studio 的 Build 菜单、直接 `./gradlew assembleRelease`）
# 用的 —— 否则 Flutter Gradle 插件会用默认的 arm/arm64/x64 三份。
# 打包层面的兜底在 `app/build.gradle.kts` 的 `packaging.jniLibs.excludes`。
target-platform=android-arm64
